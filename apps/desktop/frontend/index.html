<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay</title>
    <script>
      (() => {
        const systemTheme = () => {
          try {
            return typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch {
            return 'light';
          }
        };

        const platform = navigator.platform || navigator.userAgent || '';
        const defaultTheme = { mode: 'system', light: 'light', dark: 'dark' };
        const bootVariants = {
          light: { mode: 'light', bg: '#ffffff', text: '#343434', muted: '#7a7a82', accent: '#4a55d4', mix: '#25d0d8' },
          'light-monochrome': { mode: 'light', bg: '#ffffff', text: '#343434', muted: '#74747a', accent: '#525252', mix: '#a3a3a3' },
          'light-pastel': { mode: 'light', bg: '#fdfaf7', text: '#2b2f3a', muted: '#85796a', accent: '#d16c6c', mix: '#88c0d0' },
          'catppuccin-latte': { mode: 'light', bg: '#eff1f5', text: '#4c4f69', muted: '#6c6f85', accent: '#8839ef', mix: '#04a5e5' },
          'vscode-light': { mode: 'light', bg: '#ffffff', text: '#000000', muted: '#616161', accent: '#007acc', mix: '#3794ff' },
          dark: { mode: 'dark', bg: '#1a1a1a', text: '#cccccc', muted: '#909090', accent: '#5865f2', mix: '#25d0d8' },
          'dark-monochrome': { mode: 'dark', bg: '#1e1e1e', text: '#d4d4d4', muted: '#969696', accent: '#a3a3a3', mix: '#666666' },
          'dark-pastel': { mode: 'dark', bg: '#1a1625', text: '#e8e0f0', muted: '#aaa0b7', accent: '#f0a6ca', mix: '#9ccfd8' },
          'catppuccin-frappe': { mode: 'dark', bg: '#303446', text: '#c6d0f5', muted: '#a5adce', accent: '#ca9ee6', mix: '#99d1db' },
          'catppuccin-macchiato': { mode: 'dark', bg: '#24273a', text: '#cad3f5', muted: '#a5adcb', accent: '#c6a0f6', mix: '#91d7e3' },
          'catppuccin-mocha': { mode: 'dark', bg: '#1e1e2e', text: '#cdd6f4', muted: '#a6adc8', accent: '#cba6f7', mix: '#89dceb' },
          nord: { mode: 'dark', bg: '#2e3440', text: '#d8dee9', muted: '#aab4c3', accent: '#88c0d0', mix: '#81a1c1' },
          'vscode-dark': { mode: 'dark', bg: '#1e1e1e', text: '#d4d4d4', muted: '#969696', accent: '#007acc', mix: '#3794ff' },
        };
        const isLightVariant = value => bootVariants[value]?.mode === 'light';
        const isDarkVariant = value => bootVariants[value]?.mode === 'dark';
        const normalize = value => value === 'dark' || value === 'light' || value === 'system' ? value : 'system';
        const normalizeTheme = value => {
          if (typeof value === 'string') return { ...defaultTheme, mode: normalize(value) };
          if (!value || typeof value !== 'object') return { ...defaultTheme };
          return {
            mode: normalize(value.mode),
            light: isLightVariant(value.light) ? value.light : defaultTheme.light,
            dark: isDarkVariant(value.dark) ? value.dark : defaultTheme.dark,
          };
        };
        const themeFromStorage = () => {
          const stored = localStorage.getItem('relay.theme.v2');
          if (stored) {
            try {
              const parsed = JSON.parse(stored);
              return normalizeTheme(parsed);
            } catch {
              return normalizeTheme(stored);
            }
          }
          return normalizeTheme(localStorage.getItem('relay.theme.v1'));
        };

        document.documentElement.dataset.platform = /Mac/i.test(platform)
          ? 'darwin'
          : /Win/i.test(platform)
            ? 'windows'
            : /Linux/i.test(platform)
              ? 'linux'
              : 'browser';

        try {
          const theme = themeFromStorage();
          const resolved = theme.mode === 'system' ? systemTheme() : theme.mode;
          const variantId = resolved === 'light' ? theme.light : theme.dark;
          const variant = bootVariants[variantId] || bootVariants[resolved];
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeVariant = variantId;
          document.documentElement.style.colorScheme = resolved;
          document.documentElement.style.setProperty('--boot-bg', variant.bg);
          document.documentElement.style.setProperty('--boot-text', variant.text);
          document.documentElement.style.setProperty('--boot-muted', variant.muted);
          document.documentElement.style.setProperty('--boot-accent', variant.accent);
          document.documentElement.style.setProperty('--boot-accent-mix', variant.mix);
        } catch {
          const resolved = systemTheme();
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeVariant = resolved;
          document.documentElement.style.colorScheme = resolved;
        }
      })();
    </script>
    <style>
      :root,
      :root[data-theme="light"] {
        --boot-bg: #f6f8fc;
        --boot-text: #1a1c2e;
        --boot-muted: #4a4d6a;
        --boot-accent: #4a55d4;
        --boot-accent-mix: #25d0d8;
      }

      :root[data-theme="dark"] {
        --boot-bg: #0f0f1a;
        --boot-text: #dde1f5;
        --boot-muted: #8a8dac;
        --boot-accent: #5865f2;
        --boot-accent-mix: #25d0d8;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --boot-bg: #0f0f1a;
          --boot-text: #dde1f5;
          --boot-muted: #8a8dac;
          --boot-accent: #5865f2;
          --boot-accent-mix: #25d0d8;
        }
      }

      html, body, #app {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-text);
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 0.32s ease;
      }

      .boot-screen.boot-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .boot-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background:
          linear-gradient(160deg, rgba(255,255,255,0.2) 0%, transparent 55%),
          linear-gradient(135deg, color-mix(in srgb, var(--boot-accent) 70%, white) 0%, var(--boot-accent) 42%, color-mix(in srgb, var(--boot-accent) 78%, black) 70%, color-mix(in srgb, var(--boot-accent) 45%, var(--boot-accent-mix)) 100%);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.34),
          inset 0 -1px 0 rgba(0,0,0,0.12),
          0 6px 22px color-mix(in srgb, var(--boot-accent) 24%, transparent);
      }

      .boot-name {
        color: var(--boot-text);
        font-size: 18px;
        font-weight: 750;
        line-height: 1;
      }

      .boot-status {
        margin-top: 5px;
        color: var(--boot-muted);
        font-size: 12px;
        line-height: 1;
      }

      .boot-loader {
        position: relative;
        width: 94px;
        height: 3px;
        margin-top: 14px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in srgb, var(--boot-muted) 24%, transparent);
      }

      .boot-loader::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--boot-accent), var(--boot-accent-mix));
        animation: boot-load 1.1s ease-in-out infinite;
      }

      @keyframes boot-load {
        0% { transform: translateX(-105%); }
        55% { transform: translateX(118%); }
        100% { transform: translateX(250%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader::after { animation: none; transform: translateX(78%); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-screen" class="boot-screen" aria-label="Relay is starting">
        <div class="boot-brand">
          <div class="boot-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 20 20" fill="none">
              <path d="M3 7h11M11 4.5l3 2.5-3 2.5" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M17 13H6M9 10.5l-3 2.5 3 2.5" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <div class="boot-name">Relay</div>
            <div class="boot-status">Starting</div>
            <div class="boot-loader" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
