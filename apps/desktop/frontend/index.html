<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurlo</title>
    <script>
      (() => {
        const systemTheme = () => {
          try {
            return typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch {
            return 'light';
          }
        };

        const platform = navigator.platform || navigator.userAgent || '';
        const defaultTheme = { mode: 'system', light: 'light', dark: 'dark' };
        const bootVariants = {
          light: { mode: 'light', bg: '#ffffff', text: '#17171a', muted: '#50505a', accent: '#4f5be8' },
          'light-monochrome': { mode: 'light', bg: '#ffffff', text: '#343434', muted: '#74747a', accent: '#525252' },
          'light-pastel': { mode: 'light', bg: '#fdfaf7', text: '#2b2f3a', muted: '#85796a', accent: '#d16c6c' },
          'catppuccin-latte': { mode: 'light', bg: '#eff1f5', text: '#4c4f69', muted: '#6c6f85', accent: '#8839ef' },
          'vscode-light': { mode: 'light', bg: '#ffffff', text: '#000000', muted: '#616161', accent: '#007acc' },
          dark: { mode: 'dark', bg: '#111113', text: '#ececef', muted: '#a6a6ae', accent: '#5865f2' },
          'dark-monochrome': { mode: 'dark', bg: '#1e1e1e', text: '#d4d4d4', muted: '#969696', accent: '#a3a3a3' },
          'dark-pastel': { mode: 'dark', bg: '#1a1625', text: '#e8e0f0', muted: '#aaa0b7', accent: '#f0a6ca' },
          'catppuccin-frappe': { mode: 'dark', bg: '#303446', text: '#c6d0f5', muted: '#a5adce', accent: '#ca9ee6' },
          'catppuccin-macchiato': { mode: 'dark', bg: '#24273a', text: '#cad3f5', muted: '#a5adcb', accent: '#c6a0f6' },
          'catppuccin-mocha': { mode: 'dark', bg: '#1e1e2e', text: '#cdd6f4', muted: '#a6adc8', accent: '#cba6f7' },
          nord: { mode: 'dark', bg: '#2e3440', text: '#d8dee9', muted: '#aab4c3', accent: '#88c0d0' },
          'vscode-dark': { mode: 'dark', bg: '#1e1e1e', text: '#d4d4d4', muted: '#969696', accent: '#007acc' },
        };
        const isLightVariant = value => bootVariants[value]?.mode === 'light';
        const isDarkVariant = value => bootVariants[value]?.mode === 'dark';
        const normalize = value => value === 'dark' || value === 'light' || value === 'system' ? value : 'system';
        const normalizeTheme = value => {
          if (typeof value === 'string') return { ...defaultTheme, mode: normalize(value) };
          if (!value || typeof value !== 'object') return { ...defaultTheme };
          return {
            mode: normalize(value.mode),
            light: isLightVariant(value.light) ? value.light : defaultTheme.light,
            dark: isDarkVariant(value.dark) ? value.dark : defaultTheme.dark,
          };
        };
        const themeFromStorage = () => {
          const stored = localStorage.getItem('kurlo.theme.v2');
          if (stored) {
            try {
              const parsed = JSON.parse(stored);
              return normalizeTheme(parsed);
            } catch {
              return normalizeTheme(stored);
            }
          }
          return normalizeTheme(localStorage.getItem('kurlo.theme.v1'));
        };

        document.documentElement.dataset.platform = /Mac/i.test(platform)
          ? 'darwin'
          : /Win/i.test(platform)
            ? 'windows'
            : /Linux/i.test(platform)
              ? 'linux'
              : 'browser';

        try {
          const scale = Number.parseFloat(localStorage.getItem('kurlo.uiScale.v1') || '');
          if (Number.isFinite(scale) && scale >= 0.5 && scale <= 2 && scale !== 1) document.documentElement.style.fontSize = `${scale * 100}%`;
        } catch {}

        try {
          const theme = themeFromStorage();
          const resolved = theme.mode === 'system' ? systemTheme() : theme.mode;
          const variantId = resolved === 'light' ? theme.light : theme.dark;
          const variant = bootVariants[variantId] || bootVariants[resolved];
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeVariant = variantId;
          document.documentElement.style.colorScheme = resolved;
          document.documentElement.style.setProperty('--boot-bg', variant.bg);
          document.documentElement.style.setProperty('--boot-text', variant.text);
          document.documentElement.style.setProperty('--boot-muted', variant.muted);
          document.documentElement.style.setProperty('--boot-accent', variant.accent);
        } catch {
          const resolved = systemTheme();
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeVariant = resolved;
          document.documentElement.style.colorScheme = resolved;
        }
      })();
    </script>
    <style>
      :root,
      :root[data-theme="light"] {
        --boot-bg: #ffffff;
        --boot-text: #17171a;
        --boot-muted: #50505a;
        --boot-accent: #4f5be8;
      }

      :root[data-theme="dark"] {
        --boot-bg: #111113;
        --boot-text: #ececef;
        --boot-muted: #a6a6ae;
        --boot-accent: #5865f2;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --boot-bg: #111113;
          --boot-text: #ececef;
          --boot-muted: #a6a6ae;
          --boot-accent: #5865f2;
        }
      }

      html, body, #app {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-text);
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 0.32s ease;
      }

      .boot-screen.boot-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .boot-mark {
        display: block;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16), 0 6px 18px rgba(0, 0, 0, 0.18);
        -webkit-user-drag: none;
      }

      .boot-name {
        color: var(--boot-text);
        font-size: 18px;
        font-weight: 600;
        line-height: 1;
      }

      .boot-status {
        margin-top: 5px;
        color: var(--boot-muted);
        font-size: 12px;
        line-height: 1;
      }

      .boot-loader {
        position: relative;
        width: 94px;
        height: 3px;
        margin-top: 14px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in srgb, var(--boot-muted) 24%, transparent);
      }

      .boot-loader::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        border-radius: inherit;
        background: var(--boot-accent);
        animation: boot-load 1.1s ease-in-out infinite;
      }

      @keyframes boot-load {
        0% { transform: translateX(-105%); }
        55% { transform: translateX(118%); }
        100% { transform: translateX(250%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader::after { animation: none; transform: translateX(78%); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-screen" class="boot-screen" aria-label="Kurlo is starting">
        <div class="boot-brand">
          <img class="boot-mark" src="./src/lib/assets/kurlo-mark.png" alt="" width="44" height="44" draggable="false" />
          <div>
            <div class="boot-name">Kurlo</div>
            <div class="boot-status">Starting</div>
            <div class="boot-loader" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
