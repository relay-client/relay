









name: web-deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:



          RELAY_SITE_URL: ${{ vars.RELAY_SITE_URL }}
          RELAY_SITE_BASE: ${{ vars.RELAY_SITE_BASE }}
        run: npm run web:build

      - name: Check docs
        run: npm run web:check-docs

      - name: Pin the custom domain
        env:
          RELAY_SITE_URL: ${{ vars.RELAY_SITE_URL }}
        run: |
          set -euo pipefail
          # apps/web/public/CNAME carries the production host. A RELAY_SITE_URL repository
          # variable overrides it, so a staging deploy cannot claim the real domain — and a
          # *.github.io value drops the file altogether.
          if [ -n "${RELAY_SITE_URL}" ]; then
            host="$(printf '%s' "${RELAY_SITE_URL}" | sed -E 's#^[a-z]+://##; s#/.*$##')"
            case "$host" in
              *.github.io) rm -f apps/web/dist/CNAME ;;
              *) printf '%s\n' "$host" > apps/web/dist/CNAME ;;
            esac
          fi
          if [ -f apps/web/dist/CNAME ]; then
            echo "Deploying to custom domain: $(cat apps/web/dist/CNAME)"
          else
            echo "Deploying without a custom domain"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
