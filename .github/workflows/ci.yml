name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a quick succession of pushes
# doesn't pile up CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Check frontend
        run: npm run frontend:check

      - name: Test frontend
        run: npm --workspace @relay/desktop-frontend run test

      # main.go embeds frontend/dist (//go:embed), so the Go build/tests below
      # need the frontend built first.
      - name: Build frontend
        run: npm run frontend:build

      # Built with the same base as the deploy so the docs check can catch links
      # that would 404 under the Pages sub-path.
      - name: Build web docs
        env:
          RELAY_SITE_URL: ${{ vars.RELAY_SITE_URL }}
          RELAY_SITE_BASE: ${{ vars.RELAY_SITE_BASE }}
        run: npm run web:build

      - name: Check web docs
        env:
          RELAY_SITE_BASE: ${{ vars.RELAY_SITE_BASE }}
        run: npm run web:check-docs

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l apps/desktop/)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need 'gofmt -w':"
            echo "$unformatted"
            exit 1
          fi
          echo "All Go files are formatted."

      - name: Vet Go
        run: go vet ./apps/desktop/...

      - name: Test Go (race detector)
        run: go test -race ./apps/desktop/...

      - name: Dead code check
        run: |
          output=$(go run golang.org/x/tools/cmd/deadcode@v0.45.0 -test ./apps/desktop/...)
          if [ -n "$output" ]; then
            echo "::error::Unreachable (dead) code detected — remove it or wire it up:"
            echo "$output"
            exit 1
          fi
          echo "No dead code."

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/desktop/frontend

      - name: Run E2E tests
        run: npm run frontend:e2e
        env:
          RELAY_E2E_ARTIFACT_DIR: ${{ runner.temp }}/playwright

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        # The report is a debugging aid — an upload failure (e.g. artifact
        # storage quota exhausted) must not fail an otherwise green job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ runner.temp }}/playwright/html-report
          retention-days: 7
          if-no-files-found: ignore
