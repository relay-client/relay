name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

env:
  WAILS_VERSION: v2.13.0
  GO_MODULE: github.com/relay-client/relay/apps/desktop/internal/api
  UPDATE_REPOSITORY: relay-client/relay
  UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: macos
          - os: windows-latest
            platform: windows/amd64
            artifact: windows
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config libfuse2

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Set version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/wails.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.info = j.info || {};
            j.info.productVersion = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      - name: Require update signing public key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_PUBLIC_KEY:-}" ]; then
            echo "::error::Repository variable UPDATE_PUBLIC_KEY is required for release builds."
            exit 1
          fi

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          wails build -platform ${{ matrix.platform }} -ldflags "\
            -X ${{ env.GO_MODULE }}.appVersion=${{ env.VERSION }} \
            -X ${{ env.GO_MODULE }}.githubRepo=${{ env.UPDATE_REPOSITORY }} \
            -X ${{ env.GO_MODULE }}.updatePublicKey=${{ env.UPDATE_PUBLIC_KEY }}"
        working-directory: apps/desktop

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UPDATE_REPOSITORY: ${{ env.UPDATE_REPOSITORY }}
          UPDATE_PUBLIC_KEY: ${{ env.UPDATE_PUBLIC_KEY }}
        run: |
          wails build -platform ${{ matrix.platform }} -nsis -ldflags `
            "-X ${{ env.GO_MODULE }}.appVersion=${{ env.VERSION }} `
             -X ${{ env.GO_MODULE }}.githubRepo=$env:UPDATE_REPOSITORY `
             -X ${{ env.GO_MODULE }}.updatePublicKey=$env:UPDATE_PUBLIC_KEY"
        working-directory: apps/desktop

      - name: Build Windows MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = ""
          if (-not [string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "relay-msix.pfx"
            [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
          }

          ./build/windows/package-msix.ps1 `
            -Version "$env:VERSION" `
            -OutputPath "build/bin/relay-$env:VERSION-windows-amd64.msix" `
            -CertificatePath "$certificatePath" `
            -CertificatePassword "$env:MSIX_CERTIFICATE_PASSWORD"
        working-directory: apps/desktop

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          wails build -platform ${{ matrix.platform }} -ldflags "\
            -X ${{ env.GO_MODULE }}.appVersion=${{ env.VERSION }} \
            -X ${{ env.GO_MODULE }}.githubRepo=${{ env.UPDATE_REPOSITORY }} \
            -X ${{ env.GO_MODULE }}.updatePublicKey=${{ env.UPDATE_PUBLIC_KEY }}"
        working-directory: apps/desktop

      - name: Package macOS raw binary
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          cp apps/desktop/build/bin/Relay.app/Contents/MacOS/relay release/relay-darwin-universal

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          mkdir -p release
          apps/desktop/build/darwin/make-dmg.sh \
            apps/desktop/build/bin/Relay.app \
            "release/relay-${VERSION}-darwin-universal.dmg" \
            "Relay ${VERSION}"

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Build output:"; Get-ChildItem apps\desktop\build\bin\ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force release | Out-Null
          $installer = Get-ChildItem apps\desktop\build\bin\*installer.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found in build\bin — check that NSIS is installed and wails build -nsis succeeded" }
          Copy-Item $installer.FullName "release\relay-$env:VERSION-windows-amd64-installer.exe"
          $msix = Get-ChildItem apps\desktop\build\bin\*.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msix) { throw "MSIX package not found in build\bin — check that package-msix.ps1 succeeded" }
          Copy-Item $msix.FullName "release\relay-$env:VERSION-windows-amd64.msix"

          $raw = Get-ChildItem apps\desktop\build\bin\*.exe -Exclude *installer* -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $raw) { throw "Raw Windows binary not found in build\bin — auto-update artifact is required" }
          Copy-Item $raw.FullName "release\relay-windows-amd64.exe"

      - name: Package Linux raw binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp apps/desktop/build/bin/relay release/relay-linux-amd64
          chmod +x release/relay-linux-amd64

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/512x512/apps \
                   release

          cp apps/desktop/build/bin/relay          AppDir/usr/bin/relay
          cp apps/desktop/build/appicon.png        AppDir/usr/share/icons/hicolor/512x512/apps/relay.png
          cp apps/desktop/build/appicon.png        AppDir/relay.png

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Relay' \
            'Exec=relay' \
            'Icon=relay' \
            'Categories=Development;' \
            'Comment=Cross-platform desktop API client' \
            > AppDir/relay.desktop
          cp AppDir/relay.desktop AppDir/usr/share/applications/relay.desktop

          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/relay" "$@"' \
            > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/relay

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            AppDir "release/relay-${VERSION}-linux-amd64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: relay-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          : > release-notes.md
          # Checkout writes the triggering tag as a lightweight ref, which loses the
          # annotation the notes are read from. Re-fetch it as the real tag object.
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          TYPE=$(git for-each-ref --format='%(objecttype)' "refs/tags/${{ github.ref_name }}")
          if [ "$TYPE" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/${{ github.ref_name }}" \
              | sed '/^-----BEGIN PGP SIGNATURE-----$/,/^-----END PGP SIGNATURE-----$/d' \
              | awk 'NF { last=NR } { line[NR]=$0 } END { for (i=1; i<=last; i++) print line[i] }' \
              > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            printf '%s\n' 'Bug fixes and improvements' > release-notes.md
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Sign update artifacts
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_PUBLIC_KEY:-}" ]; then
            echo "::error::Repository variable UPDATE_PUBLIC_KEY is required for signed updates."
            exit 1
          fi
          if [ -z "${UPDATE_SIGNING_KEY:-}" ]; then
            echo "::error::UPDATE_SIGNING_KEY secret is required for signed updates."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y minisign
          key_file="$(mktemp)"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_file"
          trap 'rm -f "$key_file"' EXIT
          for asset in release/relay-darwin-universal release/relay-windows-amd64.exe release/relay-linux-amd64; do
            if [ ! -f "$asset" ]; then
              echo "::error::missing asset for signing: $asset"
              exit 1
            fi

            minisign -S -W -s "$key_file" -t "relay $GITHUB_REF_NAME $(basename "$asset")" -m "$asset"
            test -f "${asset}.minisig"
          done

      - name: Generate update manifest
        env:
          UPDATE_REPOSITORY: ${{ env.UPDATE_REPOSITORY }}
          UPDATE_PUBLIC_KEY: ${{ env.UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          args=(
            --release-dir release
            --tag "$GITHUB_REF_NAME"
            --repo "$UPDATE_REPOSITORY"
            --notes-file release-notes.md
            --platforms darwin-universal,windows-amd64,linux-amd64
            --require-signature
          )
          python3 scripts/make-latest-json.py "${args[@]}"

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_REPOSITORY: ${{ env.UPDATE_REPOSITORY }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${UPDATE_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --repo "${UPDATE_REPOSITORY}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --repo "${UPDATE_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" release/* --repo "${UPDATE_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi

  homebrew:
    name: Update Homebrew cask
    needs: publish
    runs-on: ubuntu-22.04
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        env:
          UPDATE_REPOSITORY: ${{ env.UPDATE_REPOSITORY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${UPDATE_REPOSITORY}/releases/download/v${VERSION}/relay-${VERSION}-darwin-universal.dmg"
          SHA="$(curl -fsSL "$URL" | shasum -a 256 | awk '{print $1}')"
          mkdir -p tap/Casks
          cat > tap/Casks/relay.rb << RUBY
          cask "relay" do
            version "$VERSION"
            sha256 "$SHA"

            url "$URL"
            name "Relay"
            desc "Cross-platform desktop API client"
            homepage "https://github.com/relay-client/relay"

            app "Relay.app"
          end
          RUBY

      - name: Commit and push tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/relay.rb
          git commit -m "Update Relay to ${GITHUB_REF_NAME}" || exit 0
          git push
